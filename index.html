
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wemmbu SMP</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131b;
      color: white;
      text-align: center;
    }
    header { padding: 70px 20px; background: #202b40; }
    h1 { font-size: 48px; color: #55e6a5; }
    p { color: #d4d9e5; }
    .card {
      max-width: 600px; margin: 25px auto; padding: 25px;
      background: #1b2230; border-radius: 15px;
    }
    button {
      padding: 13px 22px; border: 0; border-radius: 8px;
      background: #55e6a5; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>WEMMBU SMP</h1>
    <p>Macera başlıyor. Kendi hikâyeni yaz!</p>
    <button onclick="navigator.clipboard.writeText('SUNUCU_IP_ADRESIN')">
      Sunucu IP'sini Kopyala
    </button>
    <p>Java Edition · Fabric 1.21.11</p>
  </header>

  <div class="card">
    <h2>Sunucumuza Hoş Geldin!</h2>
    <p>Ekonomi, PvP, kitler ve hayatta kalma seni bekliyor.</p>
  </div>

  <div class="card">
    <h2>Rütbeler</h2>
    <p>Oyuncu · VIP · VIP+ · VIP++ · Admin · Owner</p>
  </div>

  <div class="card">
    <h2>Sunucu Kuralları</h2>
    <p>Hile kullanma, oyunculara saygılı ol ve adil oyna!</p>
  </div>
</body>
</html>
